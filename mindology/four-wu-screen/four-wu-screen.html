  let s='';
  for(let ring=1;ring<=5;ring++){const p=[];for(let i=0;i<n;i++){const[x,y]=pt(i,ring/5*R);p.push(x.toFixed(1)+','+y.toFixed(1));}s+='<polygon points="'+p.join(' ')+'" fill="none" stroke="#dcdcd6" stroke-width="0.5"/>';}
  for(let i=0;i<n;i++){const[x,y]=pt(i,R);s+='<line x1="'+x.toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+cx+'" y2="'+cy+'" stroke="#dcdcd6" stroke-width="0.5"/>';}
  const fill=theme==='red'?'rgba(192,73,43,0.18)':'rgba(24,95,165,0.22)';
  const stroke=theme==='red'?'#C0492B':'#185FA5';
  const dp=[];for(let i=0;i<n;i++){const[x,y]=pt(i,vals[i]/5*R);dp.push(x.toFixed(1)+','+y.toFixed(1));}
  s+='<polygon points="'+dp.join(' ')+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.8"/>';
  for(let i=0;i<n;i++){const[x,y]=pt(i,vals[i]/5*R);s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="'+stroke+'"/>';}
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const ca=Math.cos(a),sa=Math.sin(a);const[x,y]=pt(i,R+20);const anchor=Math.abs(ca)<0.3?'middle':(ca>0?'start':'end');const dy=sa<-0.5?-5:(sa>0.5?7:0);const isRev=!!(revSet&&revSet.has(i));const col=(weakSet&&weakSet.has(i))?'#854F0B':(isRev?'#8a6d3b':'#2C2C2A');s+='<text x="'+x.toFixed(1)+'" y="'+(y+dy).toFixed(1)+'" text-anchor="'+anchor+'" font-size="12" fill="'+col+'">'+labels[i]+' '+vals[i].toFixed(2)+(isRev?' ↓':'')+'</text>';}
  document.getElementById('radar').innerHTML=s;
}

// ===== 通用详述引擎 v2（跨测评复用）=====
function mdDimInterp(short,val,good){
  if(good){
    if(val>=4) return '【'+short+' '+val.toFixed(2)+'】较好：这一维已较稳定，可保持并带动其他维。';
    if(val>=3) return '【'+short+' '+val.toFixed(2)+'】中等：基本达标，偶有波动，仍有提升空间。';
    if(val>=2) return '【'+short+' '+val.toFixed(2)+'】偏弱：这一维尚未稳，是优先发力点之一。';
    return '【'+short+' '+val.toFixed(2)+'】明显偏弱：这一维是当前主要短板，建议优先专项练习。';
  } else {
    if(val>=4) return '【'+short+' '+val.toFixed(2)+'】偏高警示：该维得分越高代表风险越重，需重点觉察。';
    if(val>=3) return '【'+short+' '+val.toFixed(2)+'】偏高风险：该维已偏高，留意别让它拖累整体。';
    if(val>=2) return '【'+short+' '+val.toFixed(2)+'】尚可：该维风险可控，继续保持。';
    return '【'+short+' '+val.toFixed(2)+'】良好：该维得分低代表表现好，是加分项。';
  }
}
function mdWeakRank(dimList){
  const adj=dimList.map(d=>({d:d, a:d.good?d.val:(5-d.val)}));
  adj.sort((x,y)=>x.a-y.a);
  return adj.slice(0,3).map(o=>o.d);
}
function mdProfile(dimList){
  const adj=dimList.map(d=>({d:d, a:d.good?d.val:(5-d.val)}));
  adj.sort((x,y)=>y.a-x.a);
  const top=adj[0].d, bot=adj[adj.length-1].d;
  let s='整体看，你的结构呈「'+top.short+' 最强、'+bot.short+' 最弱」。';
  const sp=adj[0].a-adj[adj.length-1].a;
  if(sp<=0.4) s+='各维较均衡，没有明显塌陷，协调度好。';
  else if(sp>=1.5) s+='强弱落差较大，'+bot.short+' 会反复拖累整体，建议优先把它拉起来再谈其他。';
 else s+='存在一定落差，先稳住最弱项，整体会更稳。';
  return s;
}
function mdBand(score,lo,hi){
  const a=Math.max(lo,Math.min(hi,score));
  const t=(a-lo)/((hi-lo)||1);
  if(t>=0.66) return '该档高位（接近上一阶）';
  if(t>=0.33) return '该档中位';
  return '该档低位';
}
function mdFill(o){
  const rn = o.def ? ('<strong>这一阶是什么</strong><br>'+o.def) : '';
  const lp = o.scoreText ? ('<br><br><strong>你的落点</strong><br>'+o.scoreText+(o.band?(' ｜ '+o.band):'')) : '';
  const pf = o.profile ? ('<br><br><strong>你的心智画像</strong><br>'+o.profile) : '';
  const nx = o.next ? ('<br><br><strong>下一步重点</strong><br>'+o.next) : '';
  const el=document.getElementById('resNote'); if(el) el.innerHTML = rn+lp+pf+nx;
  if(o.dimList){
    const t=document.getElementById('tri'); if(t) t.innerHTML = o.dimList.map(d=>mdDimInterp(d.short,d.val,d.good)).join('<br><br>');
  }
  if(o.dimList){
    const wk=mdWeakRank(o.dimList);
    const w=document.getElementById('weak');
    if(w){
      let h='<strong>相对短板排序（按偏离度）</strong><br>';
      wk.forEach((d,i)=>{
        const tag=i===0?' <span style=\'color:#C0492B;font-weight:700;\'>（最弱·优先）</span>':'';
        const dr=d.drill?('<br><span style=\'color:#444;\'>'+d.drill+'</span>'):'';
        h+='· '+d.short+' '+d.val.toFixed(2)+tag+dr+'<br>';
      });
      w.innerHTML=h;
    }
  }
  if(o.adviceText){ const a=document.getElementById('advice'); if(a) a.innerHTML=o.adviceText; }
}
function mdRiskBand(dimList,cid){
  const box=document.getElementById(cid); if(!box) return;
  let html='<div style=\'margin:10px 0;padding:12px 14px;border-radius:10px;border-left:4px solid #C0492B;background:#fdf3f1;\'>';
  html+='<div style=\'font-size:14px;font-weight:700;color:#C0492B;\'>⚠️ 四无风险带（得分越高＝越需关注；越低越好）</div>';
  dimList.filter(d=>!d.good).forEach(d=>{
    const pct=Math.max(0,Math.min(100,(d.val/5)*100));
    const col= d.val>=3?'#C0492B': d.val>=2?'#E08A2B':'#0F6E56';
    const lab= d.val>=3?'需重点关注': d.val>=2?'偏高风险':'尚可';
    html+='<div style=\'margin-top:8px;\'><div style=\'display:flex;justify-content:space-between;font-size:13px;\'><span>'+d.short+'</span><span style=\'color:'+col+';font-weight:700;\'>'+d.val.toFixed(2)+' · '+lab+'</span></div>';
    html+='<div style=\'height:8px;border-radius:5px;background:#eee;margin-top:3px;overflow:hidden;\'><div style=\'width:'+pct+'%;height:100%;background:'+col+';\'></div></div></div>';
  });
  html+='</div>';
  box.innerHTML=html;
}

function submit(){
  if(CFG.resultType==='org'){
    const rl=document.getElementById('redline');
    if(!rl || !rl.checked){ const h=document.getElementById('hint'); h.textContent='请先勾选红线确认，再查看结果。'; h.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  }
  const sc=getScores();
  const hint=document.getElementById('hint');
  if(sc.missing){ hint.textContent='还有题未完成，请全部作答后再看结果。'; hint.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  hint.textContent='';
  const m=effMeans(sc.byDim);
  if(CFG.resultType==='adult') renderAdult(m);
  else if(CFG.resultType==='ylevel') renderYlevel(m);
  else if(CFG.resultType==='yfreq') renderYfreq(m);
  else if(CFG.resultType==='work') renderWork(m, sc.bySub);
  else if(CFG.resultType==='fourwu') renderFourwu(m);
  else if(CFG.resultType==='org') renderOrg(m);
  else if(CFG.resultType==='boss') renderBoss(m);
  document.getElementById('result').style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

  else if(comp>=4.6&&m.emo>=4.5){ level='智者型'; note='思维完善 + 自我约束到位；若已具价值自觉，可视为达者型。'; }
  else if(comp>=4.3){ level='精英型'; note=comp>=4.5?'正向智者型过渡——打磨自我约束即可跨阶。':'懂思考会倾听，继续打磨自我约束。'; }

  const ax={crit:m.cog,emoStable:m.emo,social:m.soc,indep:5-m.naive};
  const order=Object.entries(ax).sort((a,b)=>a[1]-b[1]); const weak=order[0][0];
  const W={social:'你的相对短板在「社交成熟度」：容易从自己视角看问题、在规则与边界上含糊。练「置换」——遇到冲突先站到对方立场看一遍再回应，补“责任归位、协作定位、补位不越界、坦然说不”。',
    indep:'你的相对短板在「独立人格（去盲从/偏执）」：偶尔仍倚赖他人意见、或对认定看法调整门槛高。刻意找一次「让我改主意」的信息，练可被说服的肌肉。',
    emoStable:'你的相对短板在「情绪稳定」：情绪上头容易被推着走，被否定时偶有波动。练「暂停—复述—求证」——停 3 秒 → 复述对方的话 → 自问「这是事实还是我的情绪在驱动」；不在情绪峰值做决定。',
    crit:'你的相对短板在「批判性思考」：遇冲突易先反驳或只信单一信源。练拼板思维——主动找对立信息再下判断。'};

/* ---------- work ---------- */
function renderWork(m, bySub){
  const ab={resp:m.resp, coop:m.coop, restr:m.restr, grow:m.grow};
  // 伪谦和校准
  const p1=document.getElementById('p1').checked, p2=document.getElementById('p2').checked;
  const hit=(p1?1:0)+(p2?1:0); let restr=ab.restr, fake=false;
  if(hit>0 && ab.restr>=3.5){ restr=Math.max(1, ab.restr-0.8*hit); fake=true; }
  const cog=bySub&&bySub.cog?mean(bySub.cog):( (m.resp+m.coop+m.restr+m.grow)/4 );
  const emo=bySub&&bySub.emo?mean(bySub.emo):ab.restr;
  const soc=bySub&&bySub.soc?mean(bySub.soc):( (m.resp+m.coop)/2 );
  const abilities=[{k:'resp',n:'能承责',v:ab.resp},{k:'coop',n:'能协作',v:ab.coop},{k:'restr',n:'能自敛',v:restr},{k:'grow',n:'能成长',v:ab.grow}].sort((a,b)=>a.v-b.v);
  const weak=abilities[0], strong=abilities[3];
  const avg=(ab.resp+ab.coop+restr+ab.grow)/4;
  let met=''; abilities.forEach(a=>{ const v=a.k==='restr'?restr:a.v; const cls=a.k==='restr'?(fake?'metric warn':tag(v)):tag(v); met+='<div class="'+cls+'"><div class="m-label">'+a.n+'</div><div class="m-val">'+v.toFixed(2)+(a.k==='restr'&&fake?'*':'')+'</div></div>'; });
  document.getElementById('metrics').innerHTML=met;
  drawRadar(['能承责','能协作','能自敛','能成长'], [ab.resp,ab.coop,restr,ab.grow], 'blue', new Set());
  document.getElementById('resLevel').textContent='相对短板：'+weak.n;
  let note='四能力均分 '+avg.toFixed(2)+'，最稳的是「'+strong.n+'」（'+strong.v.toFixed(1)+'），最弱的是「'+weak.n+'」（'+weak.v.toFixed(1)+'）。';
  note+= avg>=4?'整体较稳，补齐最弱一项即可继续往上走。':(avg>=3?'整体在中段，先把最弱一项练起来，不必四面开花。':'多项偏低时，请先确认这是能力缺口，还是权责不清、管理失当等结构成因。');
  document.getElementById('resNote').textContent=note;
  const fw=document.getElementById('fakeWarn');
  if(fake){ fw.style.display='block'; fw.innerHTML='<b>真自敛 vs 伪谦和：你的「能自敛」已被下调</b>（自评 '+ab.restr.toFixed(1)+' → 校准 '+restr.toFixed(1)+'）。你在自敛题上给了高分，但同时命中 '+hit+' 项伪谦和信号——这是靠意志力维持的"好相处"表演，不是内在收敛：装一天没事、一周累、一个月崩。<b>没有边界的老好人不是成熟，是软弱。</b>请把「能自敛」按校准分看待，优先做说"不"练习。'; }
  else fw.style.display='none';
  const dims=[{k:'cog',n:'认知成熟度（摆脱反射思维）',v:cog},{k:'emo',n:'情绪成熟度（不被情绪左右）',v:emo},{k:'soc',n:'社交成熟度（尊重规则与边界）',v:soc}].sort((a,b)=>a.v-b.v);
  document.getElementById('dimBox').style.display='grid';
  document.getElementById('dimCog').textContent=cog.toFixed(2);
  document.getElementById('dimEmo').textContent=emo.toFixed(2);
  document.getElementById('dimSoc').textContent=soc.toFixed(2);
  ['dimCogBox','dimEmoBox','dimSocBox'].forEach(id=>document.getElementById(id).className='dim');
  document.getElementById({cog:'dimCogBox',emo:'dimEmoBox',soc:'dimSocBox'}[dims[0].k]).className='dim weak';
  const DIM_WHY={cog:'你的低分集中在"先问清对方要什么""反驳前先过一遍""分清事实与观点""改掉引发错误的那个反应"这类题——典型的反射思维未摆脱。',
    emo:'你的低分集中在"被指出失误先辩解""把情绪当原则去较劲""批评后只剩情绪"这类题——卡点在情绪成熟度。',
    soc:'你的低分集中在"责任归位""协作定位""补位不越界""坦然说不"这类题——卡点在社交成熟度。'};
  const DIM_DRILL={soc:'【协作边界练习（社交成熟度）】挑一件正在推的事，用三句话写下来：① 这个共同目标是什么；② 我负责的那一段从哪到哪；③ 哪一段明确不是我的，我打算怎么说清。本周至少在一次会上把第 ②③ 条讲出口。',
    cog:'【反射阻断练习（认知成熟度）】本周每次被一句话点着，先停 3 秒，问两句：「他说的是什么？」「我想的是什么？」——把两者分开写下来，再决定回应。',
    emo:'【情绪省察练习（情绪成熟度）】每天收工前记一条：今天哪句话/哪件事让我起火，情绪的来源是什么。不在情绪峰值回消息、不做重大决定。'};
  const ABILITY_DRILL={restr:'【最小必要表达练习（能自敛）】本周找一次坦然说"不"或表达异议的机会：一句话讲清"我不做什么 / 我不同意哪点 + 我能做什么"，说完不解释、不道歉、不事后补偿。',
    grow:'【修识转化练习（能成长）】挑最近一次错误，别只补结果：写下"当时我的第一反应是什么"，再写"下次换成什么反应"，并指定一个触发场景去替换它。',
    resp:'【责任归位练习（能承责）】下一次出问题时，先说"这部分是我的 + 我的补救动作是什么"，把这句放在解释外部原因之前。',
    coop:'【位置澄清练习（能协作）】在一个共同目标里明确自己那一段：既不抢别人的活，也不缩在后面。遇分歧先问对方要什么，再谈自己怎么做。'};
  document.getElementById('dimConc').innerHTML='<b>我主要卡在哪一维度 → '+dims[0].n+'</b>（'+dims[0].v.toFixed(2)+'）<br>'+DIM_WHY[dims[0].k]+'<br><span style="color:#6b6b66;font-size:12.5px;">另两维：'+dims[1].n.split('（')[0]+' '+dims[1].v.toFixed(2)+'、'+dims[2].n.split('（')[0]+' '+dims[2].v.toFixed(2)+'。只取一个主要结论，先练一处。</span>';
  const drills=[DIM_DRILL[dims[0].k]]; const abKey=weak.k; const dup=(abKey==='resp'||abKey==='coop')&&dims[0].k==='soc';
  if(!dup) drills.push(ABILITY_DRILL[abKey]);
  document.getElementById('advice').textContent='本周补强练习（'+drills.length+' 项，够了）：\n\n'+drills.join('\n\n')+'\n\n复检：1–2 周后重测，看分数变化是否有具体事例支撑，并留意是否出现新的结构性或 PUA 信号。';
}

/* ---------- fourwu ---------- */
function renderFourwu(m){
  const dims=CFG.dims; const vals=dims.map(d=>m[d.key]);
  const ranked=dims.map((d,i)=>({d:d.key,v:vals[i]})).sort((a,b)=>b.v-a.v);
  const weakest=ranked.slice(0,2).map(r=>r.d); const maxV=ranked[0].v;
  let level,note;
  if(maxV>=4){ level='四无偏重 · 整体心智成长滞后较明显'; note='最弱维度为「'+DIMNAME(weakest[0])+'」'+(weakest[1]?'、'+DIMNAME(weakest[1]):'')+'。这是整体心智成长滞后的聚合表征，建议优先在下方五维发力点逐维补强；同时请确认无高风险信号。'; }
  else if(maxV>=3){ level='四无初显 · 局部成长缺口'; note='相对偏弱在「'+DIMNAME(weakest[0])+'」'+(weakest[1]?'、'+DIMNAME(weakest[1]):'')+'。仍属成长阶段表征，非疾病标签，可针对弱维做成长练习。'; }
  else { level='四无较弱 · 心智成长状态尚可'; note='四无各维均分偏低，整体心智成长状态尚可；可把五维工具当作日常素养持续打磨。'; }
  document.getElementById('resLevel').textContent=level;
  document.getElementById('resNote').textContent=note;
  let met=''; const order=['study','social','life','value'];
  order.forEach(k=>{ const v=m[k]; const cls=v>=3?'metric warn':'metric good'; met+='<div class="'+cls+'"><div class="m-label">'+DIMNAME(k)+'</div><div class="m-val">'+v.toFixed(2)+'</div><div style="font-size:11px;color:#8a8a83;margin-top:2px;">'+(v>=3?'需关注':'尚可')+'</div></div>'; });
  document.getElementById('metrics').innerHTML=met;
  drawRadar(order.map(k=>DIMNAME(k)), vals, 'red', new Set());
  const MAP={study:{wei:'约束弱（自我约束与自律素养）',tools:'后果自负 / 体验匮乏 / 自敛',note:'把选择权与自然后果还给孩子，用「体验匮乏」替代包办代劳，日常练「自敛」——少包办、多让其承担。'},
    social:{wei:'同伴弱（同伴关系与边界意识）',tools:'互敬 / 边界 / 自敛',note:'在真实同伴互动中练「互敬」，明确表达自己的边界，也尊重他人边界；社交练「自敛」——先听后说。'},
    life:{wei:'亲子弱（亲子互动与情感表达）',tools:'行为描述法 / 三转向',note:'用录像机式「行为描述」替代评判（只说发生了什么、不加形容）；从「说服→聆听 / 塑造→护航 / 指责→开诚」三转向重建情感连接。'},
    value:{wei:'情绪弱（情绪觉察与自我调节）',tools:'情绪省察期 / 自我回归期',note:'先命名情绪、给一段「情绪省察期」让其安定，再进入「自我回归期」——把价值感从外部评判收回到自我。'}};
  let html=''; order.forEach(k=>{ const isW=weakest.includes(k); const mm=MAP[k];
    html+='<div style="margin-bottom:16px;border-radius:10px;padding:13px 15px;border-left:4px solid #d9dce2;background:#fafbfc;">'+
    '<div style="font-size:15.5px;font-weight:700;color:#185FA5;">'+DIMNAME(k)+'（均分 '+m[k].toFixed(2)+'）'+(isW?'<span style="display:inline-block;font-size:11px;background:#C0492B;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;">优先发力</span>':'')+'</div>'+
    '<div style="font-size:14px;color:#854F0B;margin-top:4px;">→ 五维发力：'+mm.wei+' ｜ 工具：'+mm.tools+'</div>'+
    '<div style="font-size:14px;color:#444441;margin-top:3px;">'+mm.note+'</div></div>'; });
  html+='<div style="margin-bottom:16px;border-radius:10px;padding:13px 15px;border-left:4px solid #b07d1e;background:#fbf6e6;"><div style="font-size:15.5px;font-weight:700;color:#185FA5;">辅助发力 · 独立维</div><div style="font-size:14px;color:#854F0B;margin-top:4px;">→ 独立弱（独立思考与信息甄别）｜ 工具：拼板 / 置换 / 信息甄别</div><div style="font-size:14px;color:#444441;margin-top:3px;">「学习无动力」常与不会独立思考、被信息牵着走有关；可用拼板思维整合多方信息、用置换视角换角度看问题、练信息甄别，反向带动自律。</div></div>';
  document.getElementById('advice').innerHTML=html;


// ---- 详述增强（通用引擎 + 四无风险带）----
(function(){
  const dl=dims.map((d,i)=>({short:d.short,val:vals[i],good:d.good,drill:(MAP[d.key]?MAP[d.key].note:'')}));
  const def='「四无」是整体心智成长滞后的聚合表征（不是单一心理疾病、不是标签）。本筛查可测可训：学习无动力／社交无能力／生活无节律／价值无感，外加一个独立维（独立思考）。';
  const next='优先发力维度：'+(weakest.map(k=>DIMNAME(k)+'（'+m[k].toFixed(2)+'）').join('、'))+'；先用对应五维工具做成长练习，再带动独立维。';
  const band= maxV>=4?'四无偏重段（滞后较明显）':(maxV>=3?'四无初显段（局部缺口）':'四无较弱段（状态尚可）');
  mdFill({levelName:level, def:def, next:next, scoreText:'最弱维 '+weakest.map(k=>DIMNAME(k)+' '+m[k].toFixed(2)).join('、'), band:band, profile:mdProfile(dl), dimList:dl,
    adviceText:'<strong>五维发力方案（按优先级）</strong><br>'+order.map(k=>{const isW=weakest.includes(k);return '· <b>'+DIMNAME(k)+'（'+m[k].toFixed(2)+'）</b>'+(isW?' <span style=\'color:#C0492B;font-weight:700;\'>优先</span>':'')+' → '+(MAP[k]?MAP[k].note:'');}).join('<br>')+'<br><span style=\'color:#5a5a55;font-size:12.5px;\'>辅助发力 · 独立维：可用拼板／置换／信息甄别带动自律。若出现自伤／自杀意念等高风险信号，请立即转介专业机构。</span>'});
  mdRiskBand(dl,'riskBand');
})();

}
/* ---------- org ---------- */
function renderOrg(m){
  const dims=CFG.dims;
  const labels=dims.map(d=>d.short);
  const vals=dims.map(d=>m[d.key]);
  const adultMean=m['adult'];
  let ratioBand, ratioPct;
  if(adultMean>=4.3){ratioBand='高';ratioPct='约 60% 以上';}
  else if(adultMean>=3.5){ratioBand='中';ratioPct='约 40–60%';}
  else if(adultMean>=2.5){ratioBand='偏低';ratioPct='约 25–40%';}
  else {ratioBand='低';ratioPct='25% 以下';}
  document.getElementById('resLevel').textContent='成人型心智占比估算：'+ratioBand+'（'+ratioPct+'）';
  const moatMean=(m['moat_crisis']+m['moat_cross']+m['dualgrow'])/3;
  let moatGrade;
  if(moatMean>=4) moatGrade='强 · 护城河较深';
  else if(moatMean>=3) moatGrade='中 · 护城河一般';
  else moatGrade='弱 · 护城河浅（风浪中易内耗）';
  document.getElementById('resNote').textContent='组织护城河（危机自驱/跨团队协作/双向奔赴）综合 '+moatMean.toFixed(2)+' → '+moatGrade+'。成人型心智占比越高，护城河越深、韧性越强。';
  let met=''; dims.forEach(d=>{const v=m[d.key];met+='<div class="'+tag(v)+'"><div class="m-label">'+d.short+'</div><div class="m-val">'+v.toFixed(2)+'</div></div>';});
  document.getElementById('metrics').innerHTML=met;
  drawRadar(labels, vals, 'blue', new Set());
  const idx=vals.map((v,i)=>i).sort((a,b)=>vals[a]-vals[b]);
  const weakIdx=idx[0]; const weakD=dims[weakIdx];
  const DUAL={
    adult:{struct:'【结构】招聘/提拔看价值观同频度与成熟度，而非只看过往业绩；对价值观确实不同频者按书面约定补偿退出（需行为事实、可举证，禁用「不同频」作不可核验解雇理由，见 ce03）。',
           mind:'【心智】把「人与事分离、岗位第一责任人制」落到日常；导入心智教育/晨会共读，从和稀泥改为就事论事的复盘文化。'},
    moat_crisis:{struct:'【结构】建立危机预案与权责手册，明确「谁在什么情况下自行决策」，减少对老板救火的依赖。',
           mind:'【心智】例行「问题→归因→补位」团队复盘，让成员在危机中先想「我能补哪一块」而非「该怪谁」。'},
    moat_cross:{struct:'【结构】跨部门协作写进 SOP/接口责任矩阵，靠机制而非靠老板协调；信息割裂处打通。',
           mind:'【心智】推「协作边界三句话」练习（共同目标/我负责哪段/哪段不是我），减少甩锅与越界。'},
    dualgrow:{struct:'【结构】变革必须两侧排课且员工侧有可见权益改善（安全感/成长路径/合理报酬）；只对员工排课=软性管控（ce02），只打动老板=空转（ce22）。',
           mind:'【心智】老板侧先做四观自检（利益/员工/风险/价值观）；员工侧给成长语言与切身收益，避免「是公司让我来的」式零主动。'}
  };
  const w=DUAL[weakD.key];
  let html='';
  html+='<div style="margin-top:6px;padding:13px 15px;border-radius:10px;border-left:4px solid #185FA5;background:#f3f8fd;">';
  html+='<div style="font-size:15px;font-weight:700;color:#185FA5;">最弱维度：'+weakD.short+'（'+vals[weakIdx].toFixed(2)+'）</div>';
  html+='<div style="font-size:14px;color:#444;margin-top:6px;line-height:1.7;">'+w.struct+'</div>';
  html+='<div style="font-size:14px;color:#444;margin-top:6px;line-height:1.7;">'+w.mind+'</div>';
  html+='</div>';
  html+='<div style="margin-top:10px;padding:11px 13px;border-radius:10px;background:#fafbfc;border:1px solid #e6e8ec;font-size:13px;color:#5a5a55;line-height:1.7;">';
  html+='⚠️ 结构/心智双清单：本报告已含结构性建议。同一问题换三批人仍复发＝结构病因（权责/考核/信息），不在人（ce12）；「心智提升」证据不能是培训满意度。<br>';
  html+='⚠️ 红线 ce01：不得把低薪/过劳/欠社保等正当劳资诉求柔化为「不同频/量场共识」——那是劳动权益通道，不是心智问题。';
  html+='</div>';
  const box=document.getElementById('orgBox');
  box.style.display='block';
  box.innerHTML=html;
}
/* ---------- boss ---------- */
function renderBoss(m){
  const dims=CFG.dims;
  const vals=dims.map(d=>m[d.key]);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const idx=vals.map((v,i)=>i).sort((a,b)=>vals[a]-vals[b]);
  const weakIdx=idx[0]; const weakD=dims[weakIdx];
  let level,note;
  if(avg>=4.3){ level='四观较成熟 · 量场源头健康'; note='四观均分 '+avg.toFixed(2)+'，作为组织量场的源头变量，你整体稳；最需打磨的是「'+weakD.short+'」（'+vals[weakIdx].toFixed(2)+'）。'; }
  else if(avg>=3.5){ level='四观基本成型 · 局部偏位'; note='均分 '+avg.toFixed(2)+'，多数观尚稳，但「'+weakD.short+'」已偏低，是优先觉察点。'; }
  else if(avg>=2.5){ level='四观失衡明显 · 源头变量需补课'; note='均分 '+avg.toFixed(2)+'，四观有多处偏位，先抓最弱一观「'+weakD.short+'」动手。'; }
  else { level='四观严重失衡 · 系统性风险高'; note='均分 '+avg.toFixed(2)+'，作为老板，心智不成熟即是组织系统性风险，建议先做最弱一观的觉察与调整。'; }
  document.getElementById('resLevel').textContent=level;
  document.getElementById('resNote').textContent=note;
  let met=''; dims.forEach((d,i)=>{ const v=vals[i]; met+='<div class="'+tag(v)+'"><div class="m-label">'+d.short+'</div><div class="m-val">'+v.toFixed(2)+'</div></div>'; });
  document.getElementById('metrics').innerHTML=met;
  drawRadar(dims.map(d=>d.short), vals, 'blue', new Set([weakIdx]));
  const ADV={
    interest:{name:'利益观',adv:'把「平衡最大化」当决策第一标尺：每次重大决策先列「被牺牲的利益方是谁」（信任/韧性/员工健康/长期）；若某一维权重为零，警惕「所有会议只审一个数」。给关键人才的对价先于要担当。'},
    people:{name:'员工观',adv:'把员工当「量场的一部分」，先给对价（安全感/成长路径/对人的理解）再要担当。停止用「公司培养了你」压正当诉求；关心员工状态不只发生在离职面谈。'},
    risk:{name:'风险观',adv:'把风险主源从「外部/周期」转回「自身认知局限与欲望失衡」。每次扩张/加杠杆前问：这是战略定力，还是驾驭不了自己的欲望？'},
    values:{name:'价值观观',adv:'价值观的信用只由冲突时刻的选择建立。举一件「因价值观而放弃的收益」——若举不出，它就是包装。把这当成下一季度的硬指标。'}
  };
  const w=ADV[weakD.key];
  let html='';
  html+='<div style="margin-top:6px;padding:13px 15px;border-radius:10px;border-left:4px solid #185FA5;background:#f3f8fd;">';
  html+='<div style="font-size:15px;font-weight:700;color:#185FA5;">最偏的一观：'+w.name+'（'+vals[weakIdx].toFixed(2)+'）</div>';
  html+='<div style="font-size:14px;color:#444;margin-top:6px;line-height:1.7;">'+w.adv+'</div>';
  html+='</div>';
  html+='<div style="margin-top:10px;padding:11px 13px;border-radius:10px;background:#fafbfc;border:1px solid #e6e8ec;font-size:13px;color:#5a5a55;line-height:1.7;">';
  html+='⚠️ 源头变量定位：四观偏位只说明「源头变量」需补课，<b>不替代对行业周期/政策/团队/运气的解释</b>（ce11），别把企业成败单因归到心智。<br>';
  html+='⚠️ 红线 ce01：本自检<b>不得</b>把低薪/过劳/欠社保等正当劳资诉求柔化为「不同频/心智不成熟」——那是劳动权益通道。<br>';
  html+='⚠️ 逆发展·顺平衡（ce44 防挪用）：刹车是战略定力，不是拒资/拒加薪/拒扩编的话术；「顺平衡」须同时约束老板侧与员工侧，不可只砍员工侧成本。<br>';
  html+='⚠️ 心智学不替代医疗/法律；出现持续情绪崩溃、躯体化、自伤意念请转介专业机构。';
  html+='</div>';
  const box=document.getElementById('orgBox');
  box.style.display='block';
  box.innerHTML=html;
}
function DIMNAME(k){ const d=CFG.dims.find(x=>x.key===k); return d?d.short:k; }

document.getElementById('foot').textContent=FOOTNOTE;
