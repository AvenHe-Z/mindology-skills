function adultProfile(m){
  const arr=[['认知',m.cog],['情绪',m.emo],['社交',m.soc]].sort((a,b)=>b[1]-a[1]);
  const top=arr[0], bot=arr[2], span=top[1]-bot[1];
  if(span<=0.4 && m.cog>=3.5) return ['均衡稳健型', '你的认知 / 情绪 / 社交三要素差距很小（≤0.4），整体齐头并进、没有塌陷，这是最稳的画像。保持均衡，再整体向上抬。'];
  if(bot[0]==='情绪') return ['情绪变量型', '你的认知与社交都不弱，但情绪稳定性是最大变量——平时稳，一被否定或上头就波动。重点练「暂停—复述—求证」，把情绪峰值管住。'];
  if(bot[0]==='社交') return ['独行思辨型', '你独立思考、事实清楚，但规则与边界、换位协作是弱环，容易「自己想得清、和别人处不顺」。练置换视角，把协作定位补齐。'];
  if(top[0]==='认知') return ['思辨领先型', '你的认知成熟度跑在最前，看事清楚、会核实；但情绪或社交相对滞后，容易「想得透、处得磕」。先把领先项稳住，再补最弱项。'];
  if(top[0]==='社交') return ['协作润类型', '你的社交成熟度最突出，是团队里让人安心的人；但要注意别用「好相处」掩盖真实边界——协作 ≠ 讨好。'];
  return ['均衡发展型', '三要素各有高低但都在成长区间，按最弱项逐步补齐即可。'];
}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function getScores(){
  const byDim={}; const bySub={}; CFG.dims.forEach(d=>{byDim[d.key]=[];});
  let missing=0;
  document.querySelectorAll('.opts').forEach(box=>{
    const el=box.querySelector('input:checked');
    if(!el){ missing++; return; }
    const dim=box.dataset.dim; const v=+el.value; const flip=box.dataset.flip==='1';
    byDim[dim].push(flip?6-v:v);
    if(box.dataset.sub){(bySub[box.dataset.sub]=bySub[box.dataset.sub]||[]).push(flip?6-v:v);}
  });
  for(const d of CFG.dims){ if(byDim[d.key].length < CFG.drawPerDim) return {missing: missing||1}; }
  return {byDim, bySub, missing:0};
}
function mean(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function effMeans(byDim){ const m={}; CFG.dims.forEach(d=>{ m[d.key]=mean(byDim[d.key]); }); return m; }
function tag(v){ return 'metric ' + (v>=4?'good':(v<3?'warn':'')); }
function drawRadar(labels, vals, theme, weakSet, revSet){
  const cx=250, cy=172, R=100, n=labels.length;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  let s='';
  for(let ring=1;ring<=5;ring++){const p=[];for(let i=0;i<n;i++){const[x,y]=pt(i,ring/5*R);p.push(x.toFixed(1)+','+y.toFixed(1));}s+='<polygon points="'+p.join(' ')+'" fill="none" stroke="#dcdcd6" stroke-width="0.5"/>';}
  for(let i=0;i<n;i++){const[x,y]=pt(i,R);s+='<line x1="'+x.toFixed(1)+'" y1="'+y.toFixed(1)+'" x2="'+cx+'" y2="'+cy+'" stroke="#dcdcd6" stroke-width="0.5"/>';}
  const fill=theme==='red'?'rgba(192,73,43,0.18)':'rgba(24,95,165,0.22)';
  const stroke=theme==='red'?'#C0492B':'#185FA5';
  const dp=[];for(let i=0;i<n;i++){const[x,y]=pt(i,vals[i]/5*R);dp.push(x.toFixed(1)+','+y.toFixed(1));}
  s+='<polygon points="'+dp.join(' ')+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.8"/>';
  for(let i=0;i<n;i++){const[x,y]=pt(i,vals[i]/5*R);s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="'+stroke+'"/>';}
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const ca=Math.cos(a),sa=Math.sin(a);const[x,y]=pt(i,R+20);const anchor=Math.abs(ca)<0.3?'middle':(ca>0?'start':'end');const dy=sa<-0.5?-5:(sa>0.5?7:0);const isRev=!!(revSet&&revSet.has(i));const col=(weakSet&&weakSet.has(i))?'#854F0B':(isRev?'#8a6d3b':'#2C2C2A');s+='<text x="'+x.toFixed(1)+'" y="'+(y+dy).toFixed(1)+'" text-anchor="'+anchor+'" font-size="12" fill="'+col+'">'+labels[i]+' '+vals[i].toFixed(2)+(isRev?' ↓':'')+'</text>';}
  document.getElementById('radar').innerHTML=s;
}

/* 风险条：把 good:false 的「警示维度」从雷达移出，单独以红→绿渐变条呈现（越低越好） */
function drawRiskBar(d, v){
  const x0=20, x1=300, y=34, W=x1-x0;
  const pos = x0 + (Math.max(1,Math.min(5,v))-1)/4*W;
  const gid='rg_'+d.key;
  let s='<svg viewBox="0 0 320 72" width="100%" style="max-width:360px;display:block;margin:4px auto 0;">';
  s+='<defs><linearGradient id="'+gid+'" x1="0" x2="1"><stop offset="0" stop-color="#0F6E56"/><stop offset=".6" stop-color="#E0A800"/><stop offset="1" stop-color="#C0492B"/></linearGradient></defs>';
  s+='<rect x="'+x0+'" y="'+y+'" width="'+W+'" height="12" rx="6" fill="url(#'+gid+')"/>';
  s+='<text x="'+x0+'" y="'+(y+30)+'" font-size="10" fill="#6b6b66">1 低（好）</text>';
  s+='<text x="'+x1+'" y="'+(y+30)+'" font-size="10" fill="#6b6b66" text-anchor="end">5 高（警示）</text>';
  s+='<line x1="'+pos.toFixed(1)+'" y1="'+(y-8)+'" x2="'+pos.toFixed(1)+'" y2="'+(y+20)+'" stroke="#2C2C2A" stroke-width="2"/>';
  s+='<circle cx="'+pos.toFixed(1)+'" cy="'+y+'" r="6" fill="#2C2C2A"/>';
  s+='<text x="'+pos.toFixed(1)+'" y="'+(y-13)+'" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle">'+d.short+' '+v.toFixed(2)+'</text>';
  s+='</svg>';
  return s;
}
function renderRiskZone(warnDims, m){

  host.style.display='block';
  host.innerHTML = '<div class="rz-title">⚠ 风险维度（分高＝越需警惕；越低越好）</div>' +
    warnDims.map(d=>drawRiskBar(d, m[d.key])).join('');
}

    '铜牌级 → 重点「拼板置换」：主动找一次与己见相反的信息，练「可被说服」的肌肉；做选择前写出自己的理由。',
    '银牌级 → 重点「情绪省察期 / 自我回归期」：冲突后给自己一段复盘时间，写下「我承担了什么、下次改什么」。',
    '金牌级 → 重点「价值重塑」：每天用「意理念三基石（平衡/情感/控制）」自检，把外部评价内化为自我认知。'][idx];

/* ---------- work ---------- */
function renderWork(m, bySub){
  const ab={resp:m.resp, coop:m.coop, restr:m.restr, grow:m.grow};
  // 伪谦和校准
  const p1=document.getElementById('p1').checked, p2=document.getElementById('p2').checked;
  const hit=(p1?1:0)+(p2?1:0); let restr=ab.restr, fake=false;
  if(hit>0 && ab.restr>=3.5){ restr=Math.max(1, ab.restr-0.8*hit); fake=true; }
  const cog=bySub&&bySub.cog?mean(bySub.cog):( (m.resp+m.coop+m.restr+m.grow)/4 );
  const emo=bySub&&bySub.emo?mean(bySub.emo):ab.restr;
  const soc=bySub&&bySub.soc?mean(bySub.soc):( (m.resp+m.coop)/2 );
  const abilities=[{k:'resp',n:'能承责',v:ab.resp},{k:'coop',n:'能协作',v:ab.coop},{k:'restr',n:'能自敛',v:restr},{k:'grow',n:'能成长',v:ab.grow}].sort((a,b)=>a.v-b.v);
  const weak=abilities[0], strong=abilities[3];
  const avg=(ab.resp+ab.coop+restr+ab.grow)/4;
  let met=''; abilities.forEach(a=>{ const v=a.k==='restr'?restr:a.v; const cls=a.k==='restr'?(fake?'metric warn':tag(v)):tag(v); met+='<div class="'+cls+'"><div class="m-label">'+a.n+'</div><div class="m-val">'+v.toFixed(2)+(a.k==='restr'&&fake?'*':'')+'</div></div>'; });
  document.getElementById('metrics').innerHTML=met;
  drawRadar(['能承责','能协作','能自敛','能成长'], [ab.resp,ab.coop,restr,ab.grow], 'blue', new Set());
  document.getElementById('resLevel').textContent='相对短板：'+weak.n;
  let note='四能力均分 '+avg.toFixed(2)+'，最稳的是「'+strong.n+'」（'+strong.v.toFixed(1)+'），最弱的是「'+weak.n+'」（'+weak.v.toFixed(1)+'）。';
  note+= avg>=4?'整体较稳，补齐最弱一项即可继续往上走。':(avg>=3?'整体在中段，先把最弱一项练起来，不必四面开花。':'多项偏低时，请先确认这是能力缺口，还是权责不清、管理失当等结构成因。');
  document.getElementById('resNote').textContent=note;
  const fw=document.getElementById('fakeWarn');
  if(fake){ fw.style.display='block'; fw.innerHTML='<b>真自敛 vs 伪谦和：你的「能自敛」已被下调</b>（自评 '+ab.restr.toFixed(1)+' → 校准 '+restr.toFixed(1)+'）。你在自敛题上给了高分，但同时命中 '+hit+' 项伪谦和信号——这是靠意志力维持的"好相处"表演，不是内在收敛：装一天没事、一周累、一个月崩。<b>没有边界的老好人不是成熟，是软弱。</b>请把「能自敛」按校准分看待，优先做说"不"练习。'; }
  else fw.style.display='none';
  const dims=[{k:'cog',n:'认知成熟度（摆脱反射思维）',v:cog},{k:'emo',n:'情绪成熟度（不被情绪左右）',v:emo},{k:'soc',n:'社交成熟度（尊重规则与边界）',v:soc}].sort((a,b)=>a.v-b.v);
  document.getElementById('dimBox').style.display='grid';
  document.getElementById('dimCog').textContent=cog.toFixed(2);
  document.getElementById('dimEmo').textContent=emo.toFixed(2);
  document.getElementById('dimSoc').textContent=soc.toFixed(2);
  ['dimCogBox','dimEmoBox','dimSocBox'].forEach(id=>document.getElementById(id).className='dim');
  document.getElementById({cog:'dimCogBox',emo:'dimEmoBox',soc:'dimSocBox'}[dims[0].k]).className='dim weak';
  const DIM_WHY={cog:'你的低分集中在"先问清对方要什么""反驳前先过一遍""分清事实与观点""改掉引发错误的那个反应"这类题——典型的反射思维未摆脱。',
    emo:'你的低分集中在"被指出失误先辩解""把情绪当原则去较劲""批评后只剩情绪"这类题——卡点在情绪成熟度。',
    soc:'你的低分集中在"责任归位""协作定位""补位不越界""坦然说不"这类题——卡点在社交成熟度。'};
  const DIM_DRILL={soc:'【协作边界练习（社交成熟度）】挑一件正在推的事，用三句话写下来：① 这个共同目标是什么；② 我负责的那一段从哪到哪；③ 哪一段明确不是我的，我打算怎么说清。本周至少在一次会上把第 ②③ 条讲出口。',
    cog:'【反射阻断练习（认知成熟度）】本周每次被一句话点着，先停 3 秒，问两句：「他说的是什么？」「我想的是什么？」——把两者分开写下来，再决定回应。',
    emo:'【情绪省察练习（情绪成熟度）】每天收工前记一条：今天哪句话/哪件事让我起火，情绪的来源是什么。不在情绪峰值回消息、不做重大决定。'};
  const ABILITY_DRILL={restr:'【最小必要表达练习（能自敛）】本周找一次坦然说"不"或表达异议的机会：一句话讲清"我不做什么 / 我不同意哪点 + 我能做什么"，说完不解释、不道歉、不事后补偿。',
    grow:'【修识转化练习（能成长）】挑最近一次错误，别只补结果：写下"当时我的第一反应是什么"，再写"下次换成什么反应"，并指定一个触发场景去替换它。',
    resp:'【责任归位练习（能承责）】下一次出问题时，先说"这部分是我的 + 我的补救动作是什么"，把这句放在解释外部原因之前。',
    coop:'【位置澄清练习（能协作）】在一个共同目标里明确自己那一段：既不抢别人的活，也不缩在后面。遇分歧先问对方要什么，再谈自己怎么做。'};
  document.getElementById('dimConc').innerHTML='<b>我主要卡在哪一维度 → '+dims[0].n+'</b>（'+dims[0].v.toFixed(2)+'）<br>'+DIM_WHY[dims[0].k]+'<br><span style="color:#6b6b66;font-size:12.5px;">另两维：'+dims[1].n.split('（')[0]+' '+dims[1].v.toFixed(2)+'、'+dims[2].n.split('（')[0]+' '+dims[2].v.toFixed(2)+'。只取一个主要结论，先练一处。</span>';
  const drills=[DIM_DRILL[dims[0].k]]; const abKey=weak.k; const dup=(abKey==='resp'||abKey==='coop')&&dims[0].k==='soc';
  if(!dup) drills.push(ABILITY_DRILL[abKey]);
  document.getElementById('advice').textContent='本周补强练习（'+drills.length+' 项，够了）：\n\n'+drills.join('\n\n')+'\n\n复检：1–2 周后重测，看分数变化是否有具体事例支撑，并留意是否出现新的结构性或 PUA 信号。';
}

    life:{wei:'亲子弱（亲子互动与情感表达）',tools:'行为描述法 / 三转向',note:'用录像机式「行为描述」替代评判（只说发生了什么、不加形容）；从「说服→聆听 / 塑造→护航 / 指责→开诚」三转向重建情感连接。'},
    value:{wei:'情绪弱（情绪觉察与自我调节）',tools:'情绪省察期 / 自我回归期',note:'先命名情绪、给一段「情绪省察期」让其安定，再进入「自我回归期」——把价值感从外部评判收回到自我。'}};

           mind:'【心智】把「人与事分离、岗位第一责任人制」落到日常；导入心智教育/晨会共读，从和稀泥改为就事论事的复盘文化。'},
    moat_crisis:{struct:'【结构】建立危机预案与权责手册，明确「谁在什么情况下自行决策」，减少对老板救火的依赖。',
           mind:'【心智】例行「问题→归因→补位」团队复盘，让成员在危机中先想「我能补哪一块」而非「该怪谁」。'},
    moat_cross:{struct:'【结构】跨部门协作写进 SOP/接口责任矩阵，靠机制而非靠老板协调；信息割裂处打通。',
           mind:'【心智】推「协作边界三句话」练习（共同目标/我负责哪段/哪段不是我），减少甩锅与越界。'},
    dualgrow:{struct:'【结构】变革必须两侧排课且员工侧有可见权益改善（安全感/成长路径/合理报酬）；只对员工排课=软性管控（ce02），只打动老板=空转（ce22）。',
           mind:'【心智】老板侧先做四观自检（利益/员工/风险/价值观）；员工侧给成长语言与切身收益，避免「是公司让我来的」式零主动。'}
  };
  const w=DUAL[weakD.key];
  let html='';
  html+='<div style="margin-top:6px;padding:13px 15px;border-radius:10px;border-left:4px solid #185FA5;background:#f3f8fd;">';
  html+='<div style="font-size:15px;font-weight:700;color:#185FA5;">最弱维度：'+weakD.short+'（'+vals[weakIdx].toFixed(2)+'）</div>';
  html+='<div style="font-size:14px;color:#444;margin-top:6px;line-height:1.7;">'+w.struct+'</div>';
  html+='<div style="font-size:14px;color:#444;margin-top:6px;line-height:1.7;">'+w.mind+'</div>';
  html+='</div>';
  html+='<div style="margin-top:10px;padding:11px 13px;border-radius:10px;background:#fafbfc;border:1px solid #e6e8ec;font-size:13px;color:#5a5a55;line-height:1.7;">';
  html+='⚠️ 结构/心智双清单：本报告已含结构性建议。同一问题换三批人仍复发＝结构病因（权责/考核/信息），不在人（ce12）；「心智提升」证据不能是培训满意度。<br>';
  html+='⚠️ 红线 ce01：不得把低薪/过劳/欠社保等正当劳资诉求柔化为「不同频/量场共识」——那是劳动权益通道，不是心智问题。';
  html+='</div>';
  const box=document.getElementById('orgBox');
  box.style.display='block';
  box.innerHTML=html;
}
/* ---------- boss ---------- */
function renderBoss(m){
  const dims=CFG.dims;
  const vals=dims.map(d=>m[d.key]);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const idx=vals.map((v,i)=>i).sort((a,b)=>vals[a]-vals[b]);
  const weakIdx=idx[0]; const weakD=dims[weakIdx];
  let level,note;
  if(avg>=4.3){ level='四观较成熟 · 量场源头健康'; note='四观均分 '+avg.toFixed(2)+'，作为组织量场的源头变量，你整体稳；最需打磨的是「'+weakD.short+'」（'+vals[weakIdx].toFixed(2)+'）。'; }
  else if(avg>=3.5){ level='四观基本成型 · 局部偏位'; note='均分 '+avg.toFixed(2)+'，多数观尚稳，但「'+weakD.short+'」已偏低，是优先觉察点。'; }
  else if(avg>=2.5){ level='四观失衡明显 · 源头变量需补课'; note='均分 '+avg.toFixed(2)+'，四观有多处偏位，先抓最弱一观「'+weakD.short+'」动手。'; }
  else { level='四观严重失衡 · 系统性风险高'; note='均分 '+avg.toFixed(2)+'，作为老板，心智不成熟即是组织系统性风险，建议先做最弱一观的觉察与调整。'; }
  document.getElementById('resLevel').textContent=level;
  document.getElementById('resNote').textContent=note;
  let met=''; dims.forEach((d,i)=>{ const v=vals[i]; met+='<div class="'+tag(v)+'"><div class="m-label">'+d.short+'</div><div class="m-val">'+v.toFixed(2)+'</div></div>'; });
  document.getElementById('metrics').innerHTML=met;
  drawRadar(dims.map(d=>d.short), vals, 'blue', new Set([weakIdx]));
  const ADV={
    interest:{name:'利益观',adv:'把「平衡最大化」当决策第一标尺：每次重大决策先列「被牺牲的利益方是谁」（信任/韧性/员工健康/长期）；若某一维权重为零，警惕「所有会议只审一个数」。给关键人才的对价先于要担当。'},
    people:{name:'员工观',adv:'把员工当「量场的一部分」，先给对价（安全感/成长路径/对人的理解）再要担当。停止用「公司培养了你」压正当诉求；关心员工状态不只发生在离职面谈。'},
    risk:{name:'风险观',adv:'把风险主源从「外部/周期」转回「自身认知局限与欲望失衡」。每次扩张/加杠杆前问：这是战略定力，还是驾驭不了自己的欲望？'},
    values:{name:'价值观观',adv:'价值观的信用只由冲突时刻的选择建立。举一件「因价值观而放弃的收益」——若举不出，它就是包装。把这当成下一季度的硬指标。'}
  };
  const w=ADV[weakD.key];
  let html='';
  html+='<div style="margin-top:6px;padding:13px 15px;border-radius:10px;border-left:4px solid #185FA5;background:#f3f8fd;">';
  html+='<div style="font-size:15px;font-weight:700;color:#185FA5;">最偏的一观：'+w.name+'（'+vals[weakIdx].toFixed(2)+'）</div>';
  html+='<div style="font-size:14px;color:#444;margin-top:6px;line-height:1.7;">'+w.adv+'</div>';
  html+='</div>';
  html+='<div style="margin-top:10px;padding:11px 13px;border-radius:10px;background:#fafbfc;border:1px solid #e6e8ec;font-size:13px;color:#5a5a55;line-height:1.7;">';
  html+='⚠️ 源头变量定位：四观偏位只说明「源头变量」需补课，<b>不替代对行业周期/政策/团队/运气的解释</b>（ce11），别把企业成败单因归到心智。<br>';
  html+='⚠️ 红线 ce01：本自检<b>不得</b>把低薪/过劳/欠社保等正当劳资诉求柔化为「不同频/心智不成熟」——那是劳动权益通道。<br>';
  html+='⚠️ 逆发展·顺平衡（ce44 防挪用）：刹车是战略定力，不是拒资/拒加薪/拒扩编的话术；「顺平衡」须同时约束老板侧与员工侧，不可只砍员工侧成本。<br>';
  html+='⚠️ 心智学不替代医疗/法律；出现持续情绪崩溃、躯体化、自伤意念请转介专业机构。';
  html+='</div>';
  const box=document.getElementById('orgBox');
  box.style.display='block';
  box.innerHTML=html;
}
function DIMNAME(k){ const d=CFG.dims.find(x=>x.key===k); return d?d.short:k; }

document.getElementById('foot').textContent=FOOTNOTE;
render();
